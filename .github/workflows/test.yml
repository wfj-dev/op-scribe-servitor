name: Tests

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Run each file independently to prevent module-level discord stubs in
        # some test files from polluting later files in the same process.
        run: |
          find tests -name "test_*.py" | sort | while read f; do
            pytest "$f" -q || exit 1
          done
