name: Auto Version Bump

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - master
      - main

permissions:
  contents: write

concurrency:
  group: auto-version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-version:
    if: ${{ github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Detect skip marker in latest commit
        id: skip
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if echo "$MSG" | grep -qi '\[skip version bump\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.skip.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute and apply semantic version bump
        if: steps.skip.outputs.skip == 'false'
        id: bump
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/auto_bump_version.py "$PR_BASE_SHA..$PR_HEAD_SHA"

      - name: Detect version file changes
        if: steps.skip.outputs.skip == 'false'
        id: detect
        run: |
          if git diff --quiet -- opscribe/__init__.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read new version
        if: steps.detect.outputs.changed == 'true'
        id: version
        run: |
          VERSION="$(grep -Eo '__version__ = "[0-9]+\.[0-9]+\.[0-9]+"' opscribe/__init__.py | head -n 1 | cut -d'"' -f2)"
          if [ -z "$VERSION" ]; then
            echo "Unable to parse __version__ from opscribe/__init__.py" >&2
            exit 1
          fi
          echo "new_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opscribe/__init__.py
          git commit -m "chore(version): bump to ${{ steps.version.outputs.new_version }} [skip version bump]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
