name: Auto Version Bump

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

concurrency:
  group: auto-version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-version:
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message || '', '[skip version bump]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute and apply semantic version bump
        id: bump
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/auto_bump_version.py

      - name: Detect version file changes
        id: detect
        run: |
          if git diff --quiet -- opscribe/__init__.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read new version
        if: steps.detect.outputs.changed == 'true'
        id: version
        run: |
          VERSION="$(grep -Eo '__version__ = "[0-9]+\.[0-9]+\.[0-9]+"' opscribe/__init__.py | head -n 1 | cut -d'"' -f2)"
          if [ -z "$VERSION" ]; then
            echo "Unable to parse __version__ from opscribe/__init__.py" >&2
            exit 1
          fi
          echo "new_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opscribe/__init__.py
          git commit -m "chore(version): bump to ${{ steps.version.outputs.new_version }} [skip ci] [skip version bump]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
